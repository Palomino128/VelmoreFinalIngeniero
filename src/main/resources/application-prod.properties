# ================================================================
#  VELMORE — Perfil PROD (Servidor de producción)
#  Activar con: java -jar velmore.jar --spring.profiles.active=prod
#
#  IMPORTANTE: Los valores sensibles se leen desde variables de
#  entorno del sistema operativo o servidor de aplicaciones.
#  NUNCA escribir contraseñas directamente en este archivo.
#
#  Variables de entorno requeridas:
#    VELMORE_DB_URL      → URL completa de la base de datos
#    VELMORE_DB_USER     → Usuario MySQL
#    VELMORE_DB_PASS     → Contraseña MySQL
#    VELMORE_ADMIN_USER  → Usuario administrador VELMORE
#    VELMORE_ADMIN_PASS  → Contraseña administrador VELMORE
#    VELMORE_WA_NUMERO   → Número de WhatsApp del negocio
#    SERVER_PORT         → Puerto del servidor (default: 8080)
# ================================================================

# ── Servidor ────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── Base de datos (servidor MySQL externo) ──────────────────────
spring.datasource.url=${VELMORE_DB_URL:jdbc:mysql://localhost:3306/velmore_db?useSSL=true&serverTimezone=America/Lima}
spring.datasource.username=${VELMORE_DB_USER:root}
spring.datasource.password=${VELMORE_DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP — valores para producción
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# validate: valida el esquema sin modificarlo (seguro para producción)
spring.jpa.hibernate.ddl-auto=validate
# Ocultar SQL en producción (performance + seguridad)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Solo insertar datos si la tabla está vacía (evita duplicados)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ── Logging mínimo para producción ──────────────────────────────
logging.level.root=WARN
logging.level.pe.edu.velmore=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# ── Thymeleaf — cache habilitado en producción (performance) ────
spring.thymeleaf.cache=true

# ── Actuator (monitoreo restringido en producción) ──────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

# ── Info del sistema ────────────────────────────────────────────
info.app.name=VELMORE Librería de Perfumes
info.app.version=1.0.0
info.app.environment=Producción

# ── Seguridad de sesión ─────────────────────────────────────────
server.servlet.session.timeout=20m

# ── Errores — ocultar detalles en producción ────────────────────
server.error.include-message=never
server.error.include-stacktrace=never

# ── Credenciales admin (desde variables de entorno) ─────────────
app.admin.usuario=${VELMORE_ADMIN_USER:admin}
app.admin.clave=${VELMORE_ADMIN_PASS:Velmore2024$}

# ── WhatsApp ────────────────────────────────────────────────────
velmore.whatsapp.numero=${VELMORE_WA_NUMERO:51999999999}
