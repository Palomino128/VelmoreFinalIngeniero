# ================================================================
#  VELMORE — Perfil DEV (Desarrollo local con XAMPP)
#  Activar con: java -jar velmore.jar --spring.profiles.active=dev
#  O en NetBeans: Run > Set Project Configuration > dev
# ================================================================

# ── Servidor ────────────────────────────────────────────────────
server.port=8081

# ── Base de datos (XAMPP local) ─────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/velmore_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP — valores reducidos para desarrollo
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# update: actualiza tablas sin borrar datos (ideal para desarrollo)
spring.jpa.hibernate.ddl-auto=update
# Mostrar SQL en consola (útil para debug en desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ── Logging detallado para desarrollo ──────────────────────────
logging.level.root=INFO
logging.level.pe.edu.velmore=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ── Thymeleaf — cache deshabilitado (cambios en vivo) ──────────
spring.thymeleaf.cache=false

# ── Actuator (monitoreo) ────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ── Info del sistema ────────────────────────────────────────────
info.app.name=VELMORE Librería de Perfumes
info.app.version=1.0.0
info.app.environment=Desarrollo
info.app.description=Sistema de gestión de catálogo de perfumes con Spring Boot

# ── Seguridad de sesión ─────────────────────────────────────────
server.servlet.session.timeout=30m

# ── Errores — mostrar detalles en dev ──────────────────────────
server.error.include-message=always
server.error.include-stacktrace=on-param

# ── WhatsApp ────────────────────────────────────────────────────
velmore.whatsapp.numero=51999999999
