server.port=8081
spring.application.name=VelmoreFinalIngeniero

# ============================================================
#  PERFIL ACTIVO POR DEFECTO
#  Cambiar a 'prod' en el servidor de producci\u00c3\u00b3n:
#    java -jar velmore.jar --spring.profiles.active=prod
#  Los perfiles specificos est\u00c3\u00a1n en:
#    application-dev.properties   (desarrollo XAMPP)
#    application-prod.properties  (producci\u00c3\u00b3n servidor)
# ============================================================
spring.profiles.active=dev

# ============================================================
#  BASE DE DATOS - MySQL via XAMPP (sobrescrito por perfiles)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/velmore_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
#  JPA / HIBERNATE
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Ejecuta src/main/resources/data.sql al arrancar
spring.sql.init.mode=always
# JPA debe crear/actualizar tablas ANTES de que data.sql se ejecute
spring.jpa.defer-datasource-initialization=true

# ============================================================
#  SPRING BOOT ACTUATOR \u00e2\u0080\u0094 Monitoreo y Health Check
#  ============================================================
#  Endpoints disponibles:
#    GET /actuator                          \u00e2\u0086\u0092 listado de endpoints
#    GET /actuator/health                   \u00e2\u0086\u0092 estado general (UP/DOWN)
#    GET /actuator/health/guavacache        \u00e2\u0086\u0092 estado cach\u00c3\u00a9 Guava
#    GET /actuator/health/db                \u00e2\u0086\u0092 estado conexi\u00c3\u00b3n MySQL
#    GET /actuator/info                     \u00e2\u0086\u0092 versi\u00c3\u00b3n y tecnolog\u00c3\u00adas
#    GET /actuator/metrics                  \u00e2\u0086\u0092 listado de todas las m\u00c3\u00a9tricas
#    GET /actuator/metrics/velmore.productos.total   \u00e2\u0086\u0092 gauge din\u00c3\u00a1mico
#    GET /actuator/metrics/velmore.busquedas.total   \u00e2\u0086\u0092 contador b\u00c3\u00basquedas
#    GET /actuator/metrics/velmore.ordenes.whatsapp  \u00e2\u0086\u0092 contador WhatsApp
#    GET /actuator/metrics/velmore.cache.hit.rate    \u00e2\u0086\u0092 hit rate Guava
#    GET /actuator/metrics/jvm.memory.used           \u00e2\u0086\u0092 uso de memoria JVM
#    GET /actuator/metrics/hikaricp.connections      \u00e2\u0086\u0092 pool de conexiones
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.info.env.enabled=true

# Micrometer: Tags globales aplicados a TODAS las m\u00c3\u00a9tricas
management.metrics.tags.app=velmore
management.metrics.tags.version=1.0.0
# Habilitar m\u00c3\u00a9tricas de JVM (memoria, GC, threads)
management.metrics.enable.jvm=true
# Habilitar m\u00c3\u00a9tricas del pool de conexiones HikariCP
management.metrics.enable.hikaricp=true
# Habilitar m\u00c3\u00a9tricas de Spring MVC (latencia de controladores)
management.metrics.enable.http.server.requests=true


# Informaci\u00c3\u00b3n de la aplicaci\u00c3\u00b3n (visible en /actuator/info)
info.app.name=VELMORE Librer\u00c3\u00ada de Perfumes
info.app.version=1.0.0
info.app.description=Sistema de gesti\u00c3\u00b3n de cat\u00c3\u00a1logo de perfumes
info.app.tecnologias=Spring Boot 3.2.5, Guava, Apache POI, Apache Commons, Logback
info.app.java.version=17

# ============================================================
#  CREDENCIALES (sobrescrito por variables de entorno)
# ============================================================
app.admin.usuario=${VELMORE_ADMIN_USER:admin}
app.admin.clave=${VELMORE_ADMIN_PASSWORD:Velmore2024$}
app.cliente.usuario=${VELMORE_CLIENTE_USER:cliente}
app.cliente.clave=${VELMORE_CLIENTE_PASSWORD:cliente123}

# ============================================================
#  SEGURIDAD DE SESION
# ============================================================
server.servlet.session.timeout=20m
server.error.include-message=never
server.error.include-stacktrace=never

# ============================================================
#  WHATSAPP
# ============================================================
velmore.whatsapp.numero=${VELMORE_WA_NUMERO:51913267832}

